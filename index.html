// Zeichnet die Equity-Kurve direkt per Canvas 2D — bewusst ohne externe Bibliothek
// (Chart.js kam vorher live von cdnjs.cloudflare.com und funktionierte deshalb nicht
// ohne Internetzugriff auf diese eine Domain). Für den überschaubaren Anwendungsfall
// hier (1-3 Linien, kumulierter R-Verlauf über Kalendertage) reicht das völlig aus
// und macht die App an dieser Stelle komplett eigenständig.
// Zeichnet einen sanft geglätteten Linienzug durch die übergebenen Punkte (in ctx bereits
// per beginPath() vorbereitet) — mittels Quadratic-Bezier-Kurven durch die Mittelpunkte
// benachbarter Punkte. Trifft dabei weiterhin exakt jeden Datenpunkt (kein Überschwingen
// über den Wertebereich hinaus wie bei manchen Spline-Verfahren), wirkt aber deutlich
// runder als reine Geraden-Segmente.
function drawSmoothPath(ctx, pts){
  if(!pts.length) return;
  ctx.moveTo(pts[0].x, pts[0].y);
  if(pts.length === 1){ ctx.lineTo(pts[0].x, pts[0].y); return; }
  if(pts.length === 2){ ctx.lineTo(pts[1].x, pts[1].y); return; }
  let i;
  for(i = 1; i < pts.length - 2; i++){
    const xc = (pts[i].x + pts[i+1].x) / 2;
    const yc = (pts[i].y + pts[i+1].y) / 2;
    ctx.quadraticCurveTo(pts[i].x, pts[i].y, xc, yc);
  }
  ctx.quadraticCurveTo(pts[i].x, pts[i].y, pts[i+1].x, pts[i+1].y);
}

function drawEquityChart(canvas, labels, datasets){
  const dpr = window.devicePixelRatio || 1;
  const wrap = canvas.closest(".chart-wrap");
  const cssW = Math.max(200, (wrap ? wrap.clientWidth : canvas.clientWidth) || 600);
  const cssH = Math.max(150, (wrap ? wrap.clientHeight : canvas.clientHeight) || 260);
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  canvas.style.width = cssW + "px";
  canvas.style.height = cssH + "px";
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);
  ctx.font = "11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif";

  const legendH = 26, padL = 46, padR = 14, padT = 10 + legendH, padB = 24;
  const plotW = Math.max(10, cssW - padL - padR);
  const plotH = Math.max(10, cssH - padT - padB);

  let allVals = [];
  datasets.forEach(ds => allVals.push(...ds.data));
  if(!allVals.length) allVals = [0];
  let yMin = Math.min(0, ...allVals), yMax = Math.max(0, ...allVals);
  if(yMin === yMax){ yMin -= 1; yMax += 1; }
  const yPad = (yMax - yMin) * 0.08;
  yMin -= yPad; yMax += yPad;

  const xForIndex = i => padL + (labels.length <= 1 ? plotW / 2 : (i / (labels.length - 1)) * plotW);
  const yForVal = v => padT + plotH - ((v - yMin) / (yMax - yMin)) * plotH;

  // Horizontale Gitterlinien + Y-Achsenbeschriftung (R-Werte)
  ctx.strokeStyle = "#2a2b34";
  ctx.fillStyle = "#8b8d99";
  ctx.textBaseline = "middle";
  ctx.textAlign = "right";
  ctx.lineWidth = 1;
  const yTicks = 5;
  for(let i = 0; i <= yTicks; i++){
    const v = yMin + (yMax - yMin) * i / yTicks;
    const y = yForVal(v);
    ctx.beginPath();
    ctx.moveTo(padL, y);
    ctx.lineTo(padL + plotW, y);
    ctx.stroke();
    ctx.fillText(v.toFixed(1).replace(".", ",") + "R", padL - 8, y);
  }

  // X-Achsenbeschriftung, höchstens ~8 Labels über die volle Breite verteilt
  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  const maxXLabels = 8;
  const step = Math.max(1, Math.ceil(labels.length / maxXLabels));
  for(let i = 0; i < labels.length; i += step){
    ctx.fillText(labels[i], xForIndex(i), padT + plotH + 8);
  }

  // Nulllinie hervorheben
  ctx.setLineDash([3, 3]);
  ctx.strokeStyle = "#5c5e6b";
  ctx.beginPath();
  ctx.moveTo(padL, yForVal(0));
  ctx.lineTo(padL + plotW, yForVal(0));
  ctx.stroke();
  ctx.setLineDash([]);

  // Eine Linie pro aktivem Bereich — sanft interpoliert statt scharfer Ecken (über
  // Quadratic-Bezier-Kurven durch die Mittelpunkte benachbarter Punkte; die Linie
  // trifft dabei weiterhin exakt jeden Datenpunkt, wirkt aber deutlich runder).
  datasets.forEach(ds => {
    if(!ds.data.length) return;
    const pts = ds.data.map((v, i) => ({ x: xForIndex(i), y: yForVal(v) }));
    ctx.beginPath();
    drawSmoothPath(ctx, pts);
    ctx.strokeStyle = ds.color;
    ctx.lineWidth = 2;
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.stroke();
  });

  // Legende oben links
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  ctx.font = "12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif";
  let lx = padL;
  const ly = 14;
  datasets.forEach(ds => {
    ctx.fillStyle = ds.color;
    ctx.beginPath();
    ctx.arc(lx + 5, ly, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#8b8d99";
    ctx.fillText(ds.label, lx + 15, ly);
    lx += 15 + ctx.measureText(ds.label).width + 18;
  });
}

function renderCharts(){
  const canvas = document.getElementById("chart_equity");
  if(!canvas) return;
  const wrap = canvas.closest(".chart-wrap");
  const activeAreas = ["live","eod","backtest"].filter(a=>STATE.berichtAreas[a]);

  if(!activeAreas.length){
    if(wrap) wrap.innerHTML = `<div style="display:flex; align-items:center; justify-content:center; height:100%; color:var(--text-faint); font-size:12.5px;">Wähle mindestens einen Bereich oben aus.</div>`;
    return;
  }

  // Jede Linie nutzt ihre eigenen Trades (respektiert die aktuellen Bericht-Filter), aber
  // alle Linien teilen sich dieselbe Kalendertage-Achse, damit sie direkt vergleichbar sind.
  const tradesByArea = {};
  activeAreas.forEach(a=> tradesByArea[a] = getBerichtFilteredTradesForArea(a).filter(t=>t.r!==null && t.r!==undefined));

  const days = calendarDayRange(activeAreas.map(a=> tradesByArea[a].map(t=>t.date)));

  if(!days.length){
    if(wrap) wrap.innerHTML = `<div style="display:flex; align-items:center; justify-content:center; height:100%; color:var(--text-faint); font-size:12.5px;">Noch keine geschlossenen Trades in der aktuellen Auswahl.</div>`;
    return;
  }

  const labels = days.map(d=> d.slice(8,10)+"."+d.slice(5,7)+".");
  const datasets = activeAreas.map(a=>({
    label: AREA_LABEL[a],
    data: equityCalendarData(tradesByArea[a], days),
    color: AREA_COLOR[a]
  }));

  drawEquityChart(canvas, labels, datasets);
}

/* =========================================================================
   EXPORT / IMPORT
   ========================================================================= */
function tradesToRows(trades){
  return trades.map(t=>({
    Bereich: AREA_LABEL[t.area] || t.area,
    Datum: t.date || "",
    Markt: t.markt || "",
    Richtung: t.richtung || "",
    Session: t.session || "",
    "Entry-Art": t.art || "",
    Level: t.level || "",
    Trend: t.trend || "",
    Kriterien: (t.kriterien||[]).join(" | "),
    Invalidierung: (t.invalidierung||[]).join(" | "),
    Zeiteinheit: t.zeiteinheit || "",
    Struktur: t.struktur || "",
    Ergebnis: t.ergebnis || "",
    R: t.r===null||t.r===undefined ? "" : t.r,
    Status: t.ergebnis ? "geschlossen" : "offen",
    "Setup genommen": t.genommen===true ? "Ja" : (t.genommen===false ? "Nein" : ""),
    "Warum nicht genommen": t.grundNichtGenommen || "",
    Notizen: t.notizen || ""
  }));
}

function exportCsv(){
  const rows = tradesToRows(getBerichtFilteredTrades());
  if(!rows.length){ toast("Keine Daten zum Exportieren."); return; }
  const headers = Object.keys(rows[0]);
  const csvLines = [headers.join(";")].concat(
    rows.map(r=>headers.map(h=>`"${String(r[h]).replace(/"/g,'""')}"`).join(";"))
  );
  downloadBlob(csvLines.join("\n"), "trading-journal-export.csv", "text/csv;charset=utf-8;");
  toast("CSV exportiert.");
}

function exportXlsx(){
  if(typeof XLSX === "undefined"){ toast("Excel-Export nicht verfügbar (kein Internet)."); return; }
  const rows = tradesToRows(getBerichtFilteredTrades());
  if(!rows.length){ toast("Keine Daten zum Exportieren."); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Trades");
  XLSX.writeFile(wb, "trading-journal-export.xlsx");
  toast("Excel-Datei exportiert.");
}

function exportJson(){
  const payload = { trades: STATE.trades, config: STATE.config, insights: STATE.insights, dayConfirmations: STATE.dayConfirmations, exportedAt: new Date().toISOString() };
  downloadBlob(JSON.stringify(payload, null, 2), "trading-journal-backup.json", "application/json");
  markBackedUp();
  render();
  toast("Backup exportiert.");
}

function importJson(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(!Array.isArray(data.trades)) throw new Error("Ungültiges Format");
      const insightCount = Array.isArray(data.insights) ? data.insights.length : 0;
      if(!confirm(`${data.trades.length} Trades${insightCount?` und ${insightCount} Erkenntnisse`:""} importieren? Das ersetzt deine aktuellen Daten.`)) return;
      STATE.trades = migrateTrades(data.trades);
      if(data.config) STATE.config = Object.assign(JSON.parse(JSON.stringify(DEFAULT_CONFIG)), data.config);
      if(Array.isArray(data.insights)) STATE.insights = data.insights;
      STATE.dayConfirmations = Array.isArray(data.dayConfirmations) ? data.dayConfirmations : [];
      saveTrades(); saveConfig(); saveInsights(); saveDayConfirmations();
      markBackedUp();
      render();
      toast("Backup importiert.");
    }catch(err){
      alert("Import fehlgeschlagen: Datei ist kein gültiges Backup.");
    }
  };
  reader.readAsText(file);
}

function downloadBlob(content, filename, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* =========================================================================
   ERKENNTNISSE — freie Learnings aus dem Markt, unabhängig von einzelnen
   Trades. Mit Notiz + optionalen Screenshots, plus Stichwort-Wolke wie bei
   der Notizen-Suche im Bericht, um wiederkehrende Themen zu erkennen.
   ========================================================================= */
function emptyInsight(){
  return { id: uid(), date: todayISO(), text: "", screenshots: [], createdAt: Date.now(), updatedAt: Date.now() };
}

function renderErkenntnisse(){
  const cloudBlock = wordCloudBlockHtml({
    items: STATE.insights,
    getText: i=>i.text,
    hidden: STATE.config.hiddenInsightWords || [],
    groups: STATE.config.insightWordGroups || [],
    chipAttr: "insightword",
    hideAttr: "hideinsightword",
    restoreAttr: "restoreinsightword",
    dissolveAttr: "dissolveinsightgroup",
    mergeToggleAttr: "toggleinsightmerge",
    mergeSelectAttr: "selectinsightword",
    mergeConfirmAttr: "confirminsightmerge",
    mergeCancelAttr: "cancelinsightmerge",
    scope: "insights",
    expanded: STATE.hiddenInsightWordsExpanded,
    mergeMode: STATE.insightMergeMode,
    mergeSelection: STATE.insightMergeSelection,
    wordMenuOpen: STATE.insightWordMenuOpen,
    emptyMsg: "Noch nicht genug Erkenntnisse für wiederkehrende Themen (ein Begriff muss in mind. 2 Erkenntnissen vorkommen)."
  });

  return `
    <div class="page-head">
      <h1>Erkenntnisse</h1>
      <p>Learnings aus dem Markt — mit eigener Notiz und optionalem Screenshot festhalten.</p>
    </div>
    <div class="row-between">
      <div style="color:var(--text-dim); font-size:13.5px;">${STATE.insights.length} Erkenntnis${STATE.insights.length===1?"":"se"}</div>
      <button class="btn btn-primary" id="btnAddInsight">+ Erkenntnis hinzufügen</button>
    </div>

    <div class="panel" style="margin-bottom:22px;">
      <input type="text" id="insightSearchInput" placeholder="Erkenntnisse durchsuchen…" value="${escAttr(STATE.insightSearchQuery||"")}">
      <div style="color:var(--text-faint); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; margin:14px 0 8px;">Wiederkehrende Themen</div>
      ${cloudBlock}
    </div>

    <div id="insightListContainer">${insightListHtml(STATE.insights, STATE.insightSearchQuery)}</div>
  `;
}

function insightListHtml(insights, query){
  const q = (query||"").trim().toLowerCase();
  const filtered = q ? insights.filter(i=> matchesQuery(i.text, q)) : insights;
  const sorted = filtered.slice().sort((a,b)=> (b.date||"").localeCompare(a.date||"") || (b.createdAt||0)-(a.createdAt||0));

  if(!sorted.length){
    return `<div class="empty-state panel">
      <div class="big">◇</div>
      <div>${q ? `Keine Erkenntnisse gefunden für „${escHtml(query)}“.` : "Noch keine Erkenntnisse eingetragen."}</div>
    </div>`;
  }

  return `<div class="notes-list">${sorted.map(i=>`
    <div class="note-item" data-insightedit="${i.id}">
      <div class="note-item-head">
        <span class="tag">${i.date||""}</span>
        ${(i.screenshots&&i.screenshots.length) ? `<span class="tag">${i.screenshots.length} Screenshot${i.screenshots.length===1?"":"s"}</span>` : ""}
        <button type="button" class="btn btn-sm btn-danger" data-insightdel="${i.id}" style="margin-left:auto;">Löschen</button>
      </div>
      <div class="note-item-text">${highlightQuery(i.text, q)}</div>
      ${(i.screenshots&&i.screenshots.length) ? `
      <div class="shot-gallery" style="margin-top:10px;">
        ${i.screenshots.map((src,si)=>`<div class="shot-thumb" data-insightshotref="${i.id}:${si}"><img src="${src}"></div>`).join("")}
      </div>` : ""}
    </div>
  `).join("")}</div>`;
}

function wireErkenntnisse(){
  document.getElementById("btnAddInsight").addEventListener("click", ()=> openInsightModal(null));

  const searchInput = document.getElementById("insightSearchInput");
  if(searchInput){
    searchInput.addEventListener("input",(e)=>{
      STATE.insightSearchQuery = e.target.value;
      const container = document.getElementById("insightListContainer");
      if(container) container.innerHTML = insightListHtml(STATE.insights, STATE.insightSearchQuery);
      wireInsightListClicks();
    });
  }
  document.querySelectorAll("[data-insightword]").forEach(chip=>{
    chip.addEventListener("click", ()=>{
      STATE.insightSearchQuery = chip.dataset.insightword;
      render();
    });
  });
  wireWordCloudEvents({
    hideAttr: "hideinsightword", restoreAttr: "restoreinsightword", dissolveAttr: "dissolveinsightgroup",
    mergeToggleAttr: "toggleinsightmerge", mergeSelectAttr: "selectinsightword",
    mergeConfirmAttr: "confirminsightmerge", mergeCancelAttr: "cancelinsightmerge",
    scope: "insights", hiddenArrayKey: "hiddenInsightWords", groupsArrayKey: "insightWordGroups", onChange: render
  });
  wireInsightListClicks();
}

function wireInsightListClicks(){
  document.querySelectorAll("[data-insightedit]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const ins = STATE.insights.find(x=>x.id===el.dataset.insightedit);
      if(ins) openInsightModal(ins);
    });
  });
  document.querySelectorAll("[data-insightdel]").forEach(btn=>{
    btn.addEventListener("click",(e)=>{
      e.stopPropagation();
      if(!confirm("Diese Erkenntnis wirklich löschen?")) return;
      STATE.insights = STATE.insights.filter(x=>x.id!==btn.dataset.insightdel);
      saveInsights();
      render();
      toast("Erkenntnis gelöscht.");
    });
  });
  document.querySelectorAll("[data-insightshotref]").forEach(el=>{
    el.addEventListener("click",(e)=>{
      e.stopPropagation(); // verhindert, dass der Klick zusätzlich die Erkenntnis zum Bearbeiten öffnet
      const [insId, idx] = el.dataset.insightshotref.split(":");
      const ins = STATE.insights.find(x=>x.id===insId);
      if(ins) openLightbox(ins.screenshots[parseInt(idx,10)]);
    });
  });
}

/* ---------- Erkenntnis-Modal (Hinzufügen/Bearbeiten) ---------- */
function openInsightModal(existing){
  STATE.insightEditingId = existing ? existing.id : null;
  STATE.insightDraft = existing ? JSON.parse(JSON.stringify(existing)) : emptyInsight();
  renderInsightModal();
}

function closeInsightModal(){
  document.removeEventListener("paste", handleInsightPasteEvent);
  document.getElementById("modalRoot").innerHTML = "";
  STATE.insightDraft = null;
  STATE.insightEditingId = null;
}

function renderInsightModal(){
  const d = STATE.insightDraft;
  const isEdit = !!STATE.insightEditingId;
  const root = document.getElementById("modalRoot");
  root.innerHTML = `
  <div class="modal-backdrop" id="insightBackdrop">
    <div class="modal">
      <div class="modal-header-row">
        <div>
          <h2>${isEdit?"Erkenntnis bearbeiten":"Erkenntnis hinzufügen"}</h2>
          <div class="modal-sub">Learning aus dem Markt festhalten</div>
        </div>
        <button class="icon-btn" id="insightCloseBtn">✕</button>
      </div>

      <div class="field-group">
        <label class="fg-label">Datum</label>
        <input type="date" id="i_date" value="${d.date||""}">
      </div>

      <div class="field-group">
        <label class="fg-label">Erkenntnis</label>
        <textarea id="i_text" placeholder="Was hast du über den Markt oder dein System gelernt?" style="min-height:110px;">${escHtml(d.text||"")}</textarea>
      </div>

      <div class="field-group">
        <label class="fg-label">Screenshots ${(d.screenshots&&d.screenshots.length)?`(${d.screenshots.length})`:""}</label>
        <div class="shot-dropzone" id="insightDropzone" tabindex="0">
          <div class="shot-dropzone-hint">
            <div style="font-size:22px; margin-bottom:6px;">⎘</div>
            <div><strong>Screenshot(s) einfügen</strong> — hier klicken und <kbd>Strg</kbd>+<kbd>V</kbd> (Mac: <kbd>⌘</kbd>+<kbd>V</kbd>)</div>
            <div style="margin-top:4px;">oder Bilder hierher ziehen, oder <label class="shot-filelabel" for="i_shot">Dateien auswählen</label></div>
          </div>
        </div>
        <input type="file" id="i_shot" accept="image/*" multiple style="display:none;">
        ${(d.screenshots&&d.screenshots.length) ? `
        <div class="shot-gallery">
          ${d.screenshots.map((src,i)=>`
            <div class="shot-thumb">
              <img src="${src}">
              <button type="button" class="shot-remove" data-insightremoveshot="${i}" title="Entfernen">✕</button>
            </div>
          `).join("")}
        </div>` : ""}
      </div>

      <div class="modal-footer">
        <button class="btn btn-ghost" id="insightCancelBtn">Abbrechen</button>
        <button class="btn btn-primary" id="insightSaveBtn">${isEdit?"Speichern":"Erkenntnis speichern"}</button>
      </div>
    </div>
  </div>`;
  wireInsightModal();
}

function wireInsightModal(){
  const backdrop = document.getElementById("insightBackdrop");
  backdrop.addEventListener("click",(e)=>{ if(e.target===backdrop) closeInsightModal(); });
  document.getElementById("insightCloseBtn").addEventListener("click", closeInsightModal);
  document.getElementById("insightCancelBtn").addEventListener("click", closeInsightModal);

  document.getElementById("i_date").addEventListener("input",(e)=>{ STATE.insightDraft.date = e.target.value; });
  document.getElementById("i_text").addEventListener("input",(e)=>{ STATE.insightDraft.text = e.target.value; });

  const shotInput = document.getElementById("i_shot");
  shotInput.addEventListener("change",(e)=>{
    const files = Array.from(e.target.files || []);
    if(files.length) handleInsightImageFiles(files);
    shotInput.value = "";
  });

  const dropzone = document.getElementById("insightDropzone");
  if(dropzone){
    dropzone.addEventListener("click",(e)=>{
      if(e.target.closest(".shot-filelabel")) return;
      dropzone.focus({preventScroll:true});
    });
    dropzone.addEventListener("dragover",(e)=>{ e.preventDefault(); dropzone.classList.add("dragover"); });
    dropzone.addEventListener("dragleave",()=> dropzone.classList.remove("dragover"));
    dropzone.addEventListener("drop",(e)=>{
      e.preventDefault();
      dropzone.classList.remove("dragover");
      const files = Array.from(e.dataTransfer.files || []).filter(f=>f.type.startsWith("image/"));
      if(files.length) handleInsightImageFiles(files);
    });
  }
  document.addEventListener("paste", handleInsightPasteEvent);

  document.querySelectorAll("[data-insightremoveshot]").forEach(btn=>{
    btn.addEventListener("click",(e)=>{
      e.stopPropagation();
      const i = parseInt(btn.dataset.insightremoveshot, 10);
      STATE.insightDraft.screenshots.splice(i,1);
      renderInsightModal();
    });
  });

  document.getElementById("insightSaveBtn").addEventListener("click", saveInsightDraft);
}

function handleInsightPasteEvent(e){
  if(!STATE.insightDraft) return;
  const items = (e.clipboardData && e.clipboardData.items) || [];
  const files = [];
  for(const item of items){
    if(item.type && item.type.startsWith("image/")){
      const file = item.getAsFile();
      if(file) files.push(file);
    }
  }
  if(files.length){ e.preventDefault(); handleInsightImageFiles(files); }
}

function handleInsightImageFiles(files){
  if(!STATE.insightDraft.screenshots) STATE.insightDraft.screenshots = [];
  let remaining = files.length;
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 900;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width*scale;
        canvas.height = img.height*scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        STATE.insightDraft.screenshots.push(canvas.toDataURL("image/jpeg", 0.72));
        remaining--;
        if(remaining===0) renderInsightModal();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function saveInsightDraft(){
  const d = STATE.insightDraft;
  d.date = document.getElementById("i_date").value || d.date;
  d.text = document.getElementById("i_text").value;
  d.updatedAt = Date.now();
  const idx = STATE.insights.findIndex(x=>x.id===d.id);
  if(idx>-1) STATE.insights[idx] = d; else STATE.insights.push(d);
  saveInsights();
  closeInsightModal();
  render();
  toast("Erkenntnis gespeichert.");
}

/* =========================================================================
   INIT
   ========================================================================= */

window.addEventListener("beforeunload", (e)=>{
  if(hasUnbackedChanges()){
    e.preventDefault();
    e.returnValue = "";
  }
});
render();

// Holt beim Start automatisch den neuesten Stand über den Proxy — kein Login,

gdrivePull();
</script>
