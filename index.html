<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mein Journal</title>
<!-- GEÄNDERT: Kurzbeschreibung + noindex – privates Tool, soll nicht in Suchmaschinen auftauchen -->
<meta name="description" content="Persönliches Trading-Journal: Trades erfassen, auswerten und Erkenntnisse festhalten.">
<meta name="robots" content="noindex, nofollow">

<!-- PWA / "Zum Home-Bildschirm hinzufügen" -->
<link rel="manifest" href="manifest.webmanifest">
<!-- GEÄNDERT (Performance): Icons, Manifest, Startbild und Strategie-Bilder liegen jetzt als eigene
     Dateien statt als Base64 in dieser Datei (vorher ~1,4 MB von 1,9 MB). Vorteil: kleinere
     HTML-Datei, Bilder werden vom Browser separat gecacht, Strategie-Bilder erst bei Bedarf geladen.
     Das Startbild wird schon während des Sperrbildschirms vorgeladen. -->
<link rel="preload" href="start-bg.jpg" as="image">
<!-- GEÄNDERT (Design): Statusleisten-Farbe folgt Hell/Dunkel -->
<meta name="theme-color" content="#f5f5f7" id="metaThemeColor">
<meta name="color-scheme" content="light dark">
<script>
  /* GEÄNDERT (Design): Hell/Dunkel vor dem ersten Zeichnen setzen. Gespeicherte Wahl
     (Umschalter im Header) hat Vorrang, sonst gilt die Systemeinstellung. */
  (function(){
    var t = null;
    try{ t = localStorage.getItem("tj_theme_v1"); }catch(e){}
    if(t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
    var m = document.getElementById("metaThemeColor");
    if(m) m.setAttribute("content", t === "dark" ? "#000000" : "#f5f5f7");
  })();
</script>
<!-- GEÄNDERT (Design): Inter als Fallback für Windows/Android (Apple-Geräte nutzen SF Pro) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mein Journal">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">

<!-- GEÄNDERT: SheetJS (~900 KB) blockierte das Rendern schon vor dem Sperrbildschirm.
     Wird jetzt erst im Bericht-Reiter bzw. beim Excel-Export nachgeladen (siehe loadXlsx()). -->
<!-- GEÄNDERT (Stufe 3): Design, Programmcode und Bilder liegen in eigenen Dateien — alle direkt im Hauptverzeichnis
     (keine Unterordner, weil der GitHub-Web-Upload Ordner flach entpackt).
     ⚠ Versionsnummer ?v=… bei JEDER Änderung an allen Einbindungen auf das heutige Datum setzen
     (siehe Kopfkommentar in core.js) — sonst laden Geräte alte Dateien aus dem Cache. -->
<link rel="stylesheet" href="app.css?v=2026.10.02b">
</head>
<body>

<div id="ambientGoldGlow" aria-hidden="true"></div>

<div id="lockScreen">
  <div class="lock-box">
    <div class="lock-title">🔒 Mein Journal</div>
    <div class="lock-sub" id="lockSub">Code eingeben, um fortzufahren.</div>
    <!-- GEÄNDERT: Feld hatte keine Beschriftung; Fehlermeldung wird jetzt vorgelesen -->
    <label for="lockPinInput" class="visually-hidden">PIN-Code</label>
    <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="lockPinInput" class="lock-pin-input" autocomplete="off" aria-describedby="lockSub lockError">
    <div class="lock-error" id="lockError" role="alert" style="display:none;">Falscher Code. Bitte erneut versuchen.</div>
    <button type="button" class="btn btn-primary" id="lockSubmitBtn" style="width:100%; margin-top:14px;">Entsperren</button>
  </div>
</div>

<div id="appShell" style="display:none;">

<!-- GEÄNDERT: Sprunglink zum Inhalt für Tastaturnutzer -->
<a class="skip-link" href="#app">Zum Inhalt springen</a>

<header class="topnav">
  <div class="topnav-left">
    <div class="brand">Mein Journal</div>
  </div>
  <!-- GEÄNDERT: Name für die Navigation, type="button", aktiver Reiter per aria-current (siehe updateNavActive) -->
  <nav class="tabs" id="mainNav" aria-label="Hauptnavigation">
    <button type="button" data-view="start"><svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9v10.5h13V9"/><path d="M10 19.5v-5h4v5"/></svg><span>Start</span></button>
    <button type="button" data-view="live"><svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 12h4l2.5-6 5 12L17 12h4"/></svg><span>Live</span></button>
    <button type="button" data-view="eod"><svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><span>EOD</span></button>
    <button type="button" data-view="bericht"><svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg><span>Bericht</span></button>
    <button type="button" data-view="erkenntnisse"><svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg><span>Erkenntnisse</span></button>
    <span class="tabs-sep" aria-hidden="true"></span>
    <button type="button" data-view="strategie"><svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H20v15H5.5A1.5 1.5 0 0 0 4 19.5z"/><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H20v-3"/><path d="M8 7h8"/></svg><span>Strategie</span></button>
  </nav>
  <div class="topnav-right">
    <button type="button" class="backup-badge" id="backupBadge" title="Es gibt Änderungen seit dem letzten JSON-Backup. Klicken für den Export-Bereich im Bericht.">⚠ Ungesichert</button>
    <!-- GEÄNDERT (Design): Dunkelmodus ein/aus -->
    <button type="button" class="icon-btn theme-toggle" id="btnTheme" aria-pressed="false" aria-label="Dunkelmodus" title="Dunkelmodus ein/aus">
      <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button type="button" class="btn btn-ghost btn-sm" id="btnSettings" title="Kategorien verwalten">⚙ Kategorien</button>
  </div>
</header>

<!-- GEÄNDERT: tabindex="-1", damit Sprunglink und Fokus-Rückgabe hier landen können -->
<main id="app" tabindex="-1"></main>

<div id="modalRoot"></div>
<div id="dialogRoot"></div>
<!-- GEÄNDERT: Toasts („Gespeichert“ usw.) werden von Screenreadern angesagt -->
<div id="toastRoot" role="status" aria-live="polite"></div>

</div>

<script src="core.js?v=2026.10.02b"></script>
<script src="sync.js?v=2026.10.02b"></script>
<script src="news.js?v=2026.10.02b"></script>
<script src="state.js?v=2026.10.02b"></script>
<script src="start.js?v=2026.10.02b"></script>
<script src="trades.js?v=2026.10.02b"></script>
<script src="bericht.js?v=2026.10.02b"></script>
<script src="erkenntnisse.js?v=2026.10.02b"></script>
<script src="strategie.js?v=2026.10.02b"></script>
<script src="init.js?v=2026.10.02b"></script>
<script src="design.js?v=2026.10.02b"></script>
</body>
</html>
