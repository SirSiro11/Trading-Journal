function breakdownTableHtml(trades){
  const dimDef = FILTER_DIMENSIONS.find(d=>d.key===STATE.breakdownDim) || FILTER_DIMENSIONS[0];
  const groups = {};
  trades.forEach(t=>{
    const val = t[dimDef.field];
    if(val===null || val===undefined || val==="") return;
    if(t.r===null || t.r===undefined) return; // nur geschlossene Trades fließen in R-Auswertung ein
    (groups[val] = groups[val] || []).push(t.r);
  });
  const rows = Object.keys(groups).map(k=>{
    const arr = groups[k];
    const n = arr.length;
    const sum = arr.reduce((a,b)=>a+b,0);
    const avg = sum/n;
    const wins = arr.filter(r=>r>0).length;
    const losses = arr.filter(r=>r<0).length;
    const winrate = (wins+losses)>0 ? wins/(wins+losses) : null;
    return {k, n, sum, avg, winrate};
  }).sort((a,b)=>b.avg-a.avg);

  if(!rows.length) return `<div style="color:var(--text-dim); padding:20px 0;">Noch keine geschlossenen Trades mit Ergebnis in diesem Filter.</div>`;

  return `<table class="breakdown">
    <thead><tr><th>${dimDef.label}</th><th>Trades</th><th>Winrate</th><th>Ø R</th><th>Gesamt-R</th></tr></thead>
    <tbody>
      ${rows.map(r=>`<tr>
        <td>${escHtml(r.k)}</td>
        <td>${r.n}</td>
        <td>${r.winrate===null?"—":Math.round(r.winrate*100)+"%"}</td>
        <td class="${r.avg>0?"pos":(r.avg<0?"neg":"")}">${formatR(r.avg)}</td>
        <td class="${r.sum>0?"pos":(r.sum<0?"neg":"")}">${formatR(r.sum)}</td>
      </tr>`).join("")}
    </tbody>
  </table>`;
}

function matchesBerichtFilters(t){
  if(STATE.berichtDateFrom && t.date && t.date < STATE.berichtDateFrom) return false;
  if(STATE.berichtDateTo && t.date && t.date > STATE.berichtDateTo) return false;
  for(const dim of FILTER_DIMENSIONS){
    const sel = STATE.berichtFilters[dim.key];
    if(!sel || !sel.length) continue;
    if(dim.multi){
      const val = t[dim.field] || [];
      if(!sel.some(s=>val.includes(s))) return false;
    }else{
      if(!sel.includes(t[dim.field])) return false;
    }
  }
  return true;
}

function getBerichtFilteredTrades(){
  const activeAreas = Object.keys(STATE.berichtAreas).filter(a=>STATE.berichtAreas[a]);
  return STATE.trades.filter(t=> activeAreas.includes(t.area) && matchesBerichtFilters(t));
}

// Wie getBerichtFilteredTrades, aber auf genau einen Bereich beschränkt — unabhängig vom
// Live/Backtest/EOD-Umschalter. Wird für die Gegenüberstellung und die mehrfarbige
// Equity-Kurve gebraucht, damit jede Linie/Spalte nur "ihre eigenen" Trades zeigt.
function getBerichtFilteredTradesForArea(area){
  return STATE.trades.filter(t=> t.area===area && matchesBerichtFilters(t));
}

function computeStats(trades){
  const closed = trades.filter(t=>t.r!==null && t.r!==undefined);
  const open = trades.length - closed.length;
  const winners = closed.filter(t=>t.r>0).length;
  const losers = closed.filter(t=>t.r<0).length;
  const be = closed.filter(t=>t.r===0).length;
  const totalR = closed.reduce((a,t)=>a+t.r,0);
  const avgR = closed.length ? totalR/closed.length : 0;
  const sumPos = closed.filter(t=>t.r>0).reduce((a,t)=>a+t.r,0);
  const sumNeg = closed.filter(t=>t.r<0).reduce((a,t)=>a+t.r,0);
  const profitFactor = sumNeg!==0 ? (sumPos/Math.abs(sumNeg)) : (sumPos>0 ? Infinity : null);
  const winrate = (winners+losers)>0 ? winners/(winners+losers) : null;
  const rVals = closed.map(t=>t.r);
  const best = rVals.length ? Math.max(...rVals) : null;
  const worst = rVals.length ? Math.min(...rVals) : null;
  const avgWin = winners>0 ? sumPos/winners : null;
  const avgLoss = losers>0 ? Math.abs(sumNeg)/losers : null;

  // max drawdown on equity curve (sorted by date/createdAt)
  const sorted = closed.slice().sort((a,b)=> (a.date||"").localeCompare(b.date||"") || (a.createdAt||0)-(b.createdAt||0));
  let equity = 0, peak = 0, maxDD = 0;
  sorted.forEach(t=>{
    equity += t.r;
    if(equity>peak) peak = equity;
    const dd = peak - equity;
    if(dd>maxDD) maxDD = dd;
  });

  // Tages-Auswertung: Kalendertage mit mindestens einem Ergebnis, gruppiert nach Trade-Datum
  const byDate = {};
  closed.filter(t=>t.date).forEach(t=>{ byDate[t.date] = (byDate[t.date]||0) + t.r; });
  const daySums = Object.values(byDate);
  const greenDays = daySums.filter(s=>s>0).length;
  const redDays = daySums.filter(s=>s<0).length;
  const flatDays = daySums.filter(s=>s===0).length;
  const totalDays = daySums.length;
  const days = {
    totalDays, greenDays, redDays, flatDays,
    pct: totalDays ? Math.round((greenDays/totalDays)*100) : null,
    bestDay: daySums.length ? Math.max(...daySums) : null,
    worstDay: daySums.length ? Math.min(...daySums) : null
  };

  // Längste Verlustserie: meiste SL-Trades in Folge (chronologisch, jeder TP/BE unterbricht die Serie)
  let longestSlStreak = 0, currentSlStreak = 0;
  sorted.forEach(t=>{
    if(t.r < 0){ currentSlStreak++; longestSlStreak = Math.max(longestSlStreak, currentSlStreak); }
    else currentSlStreak = 0;
  });

  return {
    count: trades.length, open, closed: closed.length,
    winners, losers, be, totalR, avgR, sumPos, sumNeg,
    profitFactor, winrate, best, worst, avgWin, avgLoss,
    maxDrawdown: closed.length?maxDD:null, days, longestSlStreak
  };
}

// Fortlaufende Kalendertage-Liste (inklusive) über die min./max. Datums aller übergebenen
// Datums-Arrays hinweg — bildet die gemeinsame X-Achse für alle Linien im Equity-Chart.
function calendarDayRange(dateArrays){
  let all = [];
  dateArrays.forEach(arr=> all.push(...arr));
  all = all.filter(Boolean);
  if(!all.length) return [];
  const min = all.reduce((a,b)=> a<b?a:b);
  const max = all.reduce((a,b)=> a>b?a:b);
  const days = [];
  let d = new Date(min+"T00:00:00");
  const end = new Date(max+"T00:00:00");
  while(d<=end){
    days.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"));
    d.setDate(d.getDate()+1);
  }
  return days;
}

// Kumulierter R-Verlauf entlang der übergebenen Kalendertage — an Tagen ohne Ergebnis
// bleibt die Linie auf dem letzten Stand stehen (waagerecht), statt zu springen.
function equityCalendarData(trades, days){
  const byDate = {};
  trades.forEach(t=>{
    if(t.r===null || t.r===undefined || !t.date) return;
    byDate[t.date] = (byDate[t.date]||0) + t.r;
  });
  let running = 0;
  return days.map(d=>{
    if(byDate[d]!==undefined) running += byDate[d];
    return running;
  });
}

function renderCharts(){
  if(STATE.charts.equity){ STATE.charts.equity.destroy(); STATE.charts.equity = null; }

  const canvas = document.getElementById("chart_equity");
  if(!canvas) return;
  const wrap = canvas.closest(".chart-wrap");
  const activeAreas = ["live","eod","backtest"].filter(a=>STATE.berichtAreas[a]);

  if(!activeAreas.length){
    if(wrap) wrap.innerHTML = `<div style="display:flex; align-items:center; justify-content:center; height:100%; color:var(--text-faint); font-size:12.5px;">Wähle mindestens einen Bereich oben aus.</div>`;
    return;
  }
  if(typeof Chart === "undefined"){
    if(wrap) wrap.innerHTML = `<div style="display:flex; align-items:center; justify-content:center; height:100%; color:var(--text-faint); font-size:12.5px; text-align:center; padding:0 10px;">Chart-Bibliothek konnte nicht geladen werden (kein Internetzugriff auf cdnjs.cloudflare.com).</div>`;
    return;
  }

  // Jede Linie nutzt ihre eigenen Trades (respektiert die aktuellen Bericht-Filter), aber
  // alle Linien teilen sich dieselbe Kalendertage-Achse, damit sie direkt vergleichbar sind.
  const tradesByArea = {};
  activeAreas.forEach(a=> tradesByArea[a] = getBerichtFilteredTradesForArea(a).filter(t=>t.r!==null && t.r!==undefined));

  const days = calendarDayRange(activeAreas.map(a=> tradesByArea[a].map(t=>t.date)));

  if(!days.length){
    if(wrap) wrap.innerHTML = `<div style="display:flex; align-items:center; justify-content:center; height:100%; color:var(--text-faint); font-size:12.5px;">Noch keine geschlossenen Trades in der aktuellen Auswahl.</div>`;
    return;
  }

  const datasets = activeAreas.map(a=>({
    label: AREA_LABEL[a],
    data: equityCalendarData(tradesByArea[a], days),
    borderColor: AREA_COLOR[a],
    backgroundColor: AREA_COLOR[a]+"18",
    fill:false, tension:.2, pointRadius:0, borderWidth:2
  }));

  STATE.charts.equity = new Chart(canvas, {
    type:"line",
    data:{
      labels: days.map(d=> d.slice(8,10)+"."+d.slice(5,7)+"."),
      datasets
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{ legend:{ display:true, labels:{ color:"#8b8d99", boxWidth:12, usePointStyle:true, pointStyle:"circle" } } },
      scales:{
        x:{ ticks:{ color:"#8b8d99", maxTicksLimit:8, autoSkip:true }, grid:{ color:"#2a2b34" } },
        y:{ ticks:{ color:"#8b8d99" }, grid:{ color:"#2a2b34" } }
      }
    }
  });
}

function tradesToRows(trades){
  return trades.map(t=>({
    Bereich: AREA_LABEL[t.area] || t.area,
    Datum: t.date || "",
    Markt: t.markt || "",
    Richtung: t.richtung || "",
    Session: t.session || "",
    "Entry-Art": t.art || "",
    Level: t.level || "",
    Trend: t.trend || "",
    Kriterien: (t.kriterien||[]).join(" | "),
    Invalidierung: (t.invalidierung||[]).join(" | "),
    Zeiteinheit: t.zeiteinheit || "",
    Struktur: t.struktur || "",
    Ergebnis: t.ergebnis || "",
    R: t.r===null||t.r===undefined ? "" : t.r,
    Status: t.ergebnis ? "geschlossen" : "offen",
    "Setup genommen": t.genommen===true ? "Ja" : (t.genommen===false ? "Nein" : ""),
    "Warum nicht genommen": t.grundNichtGenommen || "",
    Notizen: t.notizen || ""
  }));
}

function exportCsv(){
  const rows = tradesToRows(getBerichtFilteredTrades());
  if(!rows.length){ toast("Keine Daten zum Exportieren."); return; }
  const headers = Object.keys(rows[0]);
  const csvLines = [headers.join(";")].concat(
    rows.map(r=>headers.map(h=>`"${String(r[h]).replace(/"/g,'""')}"`).join(";"))
  );
  downloadBlob(csvLines.join("\n"), "trading-journal-export.csv", "text/csv;charset=utf-8;");
  toast("CSV exportiert.");
}

function exportXlsx(){
  if(typeof XLSX === "undefined"){ toast("Excel-Export nicht verfügbar (kein Internet)."); return; }
  const rows = tradesToRows(getBerichtFilteredTrades());
  if(!rows.length){ toast("Keine Daten zum Exportieren."); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Trades");
  XLSX.writeFile(wb, "trading-journal-export.xlsx");
  toast("Excel-Datei exportiert.");
}

function exportJson(){
  const payload = { trades: STATE.trades, config: STATE.config, insights: STATE.insights, exportedAt: new Date().toISOString() };
  downloadBlob(JSON.stringify(payload, null, 2), "trading-journal-backup.json", "application/json");
  markBackedUp();
  render();
  toast("Backup exportiert.");
}

function importJson(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(!Array.isArray(data.trades)) throw new Error("Ungültiges Format");
      const insightCount = Array.isArray(data.insights) ? data.insights.length : 0;
      if(!confirm(`${data.trades.length} Trades${insightCount?` und ${insightCount} Erkenntnisse`:""} importieren? Das ersetzt deine aktuellen Daten.`)) return;
      STATE.trades = migrateTrades(data.trades);
      if(data.config) STATE.config = Object.assign(JSON.parse(JSON.stringify(DEFAULT_CONFIG)), data.config);
      if(Array.isArray(data.insights)) STATE.insights = data.insights;
      saveTrades(); saveConfig(); saveInsights();
      markBackedUp();
      render();
      toast("Backup importiert.");
    }catch(err){
      alert("Import fehlgeschlagen: Datei ist kein gültiges Backup.");
    }
  };
  reader.readAsText(file);
}

function downloadBlob(content, filename, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

      <div class="modal-footer">
        <button class="btn btn-ghost" id="insightCancelBtn">Abbrechen</button>
        <button class="btn btn-primary" id="insightSaveBtn">${isEdit?"Speichern":"Erkenntnis speichern"}</button>
      </div>
    </div>
  </div>`;
  wireInsightModal();
}

function wireInsightModal(){
  const backdrop = document.getElementById("insightBackdrop");
  backdrop.addEventListener("click",(e)=>{ if(e.target===backdrop) closeInsightModal(); });
  document.getElementById("insightCloseBtn").addEventListener("click", closeInsightModal);
  document.getElementById("insightCancelBtn").addEventListener("click", closeInsightModal);

  document.getElementById("i_date").addEventListener("input",(e)=>{ STATE.insightDraft.date = e.target.value; });
  document.getElementById("i_text").addEventListener("input",(e)=>{ STATE.insightDraft.text = e.target.value; });

  const shotInput = document.getElementById("i_shot");
  shotInput.addEventListener("change",(e)=>{
    const files = Array.from(e.target.files || []);
    if(files.length) handleInsightImageFiles(files);
    shotInput.value = "";
  });

  const dropzone = document.getElementById("insightDropzone");
  if(dropzone){
    dropzone.addEventListener("click",(e)=>{
      if(e.target.closest(".shot-filelabel")) return;
      dropzone.focus({preventScroll:true});
    });
    dropzone.addEventListener("dragover",(e)=>{ e.preventDefault(); dropzone.classList.add("dragover"); });
    dropzone.addEventListener("dragleave",()=> dropzone.classList.remove("dragover"));
    dropzone.addEventListener("drop",(e)=>{
      e.preventDefault();
      dropzone.classList.remove("dragover");
      const files = Array.from(e.dataTransfer.files || []).filter(f=>f.type.startsWith("image/"));
      if(files.length) handleInsightImageFiles(files);
    });
  }
  document.addEventListener("paste", handleInsightPasteEvent);

  document.querySelectorAll("[data-insightremoveshot]").forEach(btn=>{
    btn.addEventListener("click",(e)=>{
      e.stopPropagation();
      const i = parseInt(btn.dataset.insightremoveshot, 10);
      STATE.insightDraft.screenshots.splice(i,1);
      renderInsightModal();
    });
  });

  document.getElementById("insightSaveBtn").addEventListener("click", saveInsightDraft);
}

function handleInsightPasteEvent(e){
  if(!STATE.insightDraft) return;
  const items = (e.clipboardData && e.clipboardData.items) || [];
  const files = [];
  for(const item of items){
    if(item.type && item.type.startsWith("image/")){
      const file = item.getAsFile();
      if(file) files.push(file);
    }
  }
  if(files.length){ e.preventDefault(); handleInsightImageFiles(files); }
}

function handleInsightImageFiles(files){
  if(!STATE.insightDraft.screenshots) STATE.insightDraft.screenshots = [];
  let remaining = files.length;
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 900;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width*scale;
        canvas.height = img.height*scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        STATE.insightDraft.screenshots.push(canvas.toDataURL("image/jpeg", 0.72));
        remaining--;
        if(remaining===0) renderInsightModal();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function saveInsightDraft(){
  const d = STATE.insightDraft;
  d.date = document.getElementById("i_date").value || d.date;
  d.text = document.getElementById("i_text").value;
  d.updatedAt = Date.now();
  const idx = STATE.insights.findIndex(x=>x.id===d.id);
  if(idx>-1) STATE.insights[idx] = d; else STATE.insights.push(d);
  saveInsights();
  closeInsightModal();
  render();
  toast("Erkenntnis gespeichert.");
}

/* =========================================================================
   INIT
   ========================================================================= */
// Warnt beim Schließen/Verlassen der Seite, falls es Änderungen gibt, die noch in
// keinem JSON-Backup stecken (Browser zeigt dafür seinen eigenen Standard-Dialog,
// der Text lässt sich aus Sicherheitsgründen nicht anpassen).
window.addEventListener("beforeunload", (e)=>{
  if(hasUnbackedChanges()){
    e.preventDefault();
    e.returnValue = "";
  }
});
render();

// Falls schon einmal mit Google Drive verbunden: beim Start still (ohne Zustimmungsdialog)
// versuchen, ein neues Token zu bekommen und den neuesten Stand zu laden. Klappt das nicht
// (z. B. Google-Sitzung im Browser abgelaufen), zeigt der Bericht-Tab einfach "Nicht
// verbunden" — der Nutzer kann dann jederzeit manuell erneut auf "Verbinden" klicken.
if(!gdriveIsFileProtocol() && localStorage.getItem(LS_GDRIVE_ENABLED) === "1"){
  gdriveRequestToken(true)
    .then(()=>{ gdrivePull(); })
    .catch(()=>{ STATE.driveStatus = "disconnected"; render(); });
}
</script>
